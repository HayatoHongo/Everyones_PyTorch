    <g class="right"><circle cx="900" cy="160" r="24"/><circle cx="900" cy="225" r="24"/><circle cx="900" cy="290" r="24"/><circle cx="900" cy="355" r="24"/><circle cx="900" cy="420" r="24"/><circle cx="900" cy="485" r="24"/></g>
