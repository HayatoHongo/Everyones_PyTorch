  <text x="588" y="166" class="small">h₀</text><text x="588" y="231" class="small">h₁</text><text x="588" y="296" class="small">h₂</text><text x="588" y="361" class="small">⋮</text><text x="588" y="426" class="small">h₂₃</text><text x="588" y="491" class="small">h₂₄</text>
  <text x="938" y="166" class="small">Y₀</text><text x="938" y="231" class="small">Y₁</text><text x="938" y="296" class="small">Y₂</text><text x="938" y="361" class="small">⋮</text><text x="938" y="426" class="small">Y₈</text><text x="938" y="491" class="small">Y₉</text>
