<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-label="window sizeとoffsetからskip-gramのXとyを作る図">
<rect width="1100" height="610" fill="white"/><style>text{font-family:Arial,'Noto Sans JP',sans-serif;fill:#172554}.c{font-family:Consolas,monospace}.s{font-size:16px}.l{font-size:18px;font-weight:bold}.f{font-size:17px}</style>
<text x="60" y="48" class="l">ids</text><text x="108" y="48" class="c l">= [ a, b, c, d, e, f ]</text><text x="60" y="80" class="s">window_size = 2：中心語から1語または2語離れた単語を正解にする</text>
<rect x="55" y="105" width="990" height="270" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="80" y="137" class="l">offsetごとに追加する対応</text><text x="275" y="137" class="c l">center_list</text><text x="650" y="137" class="c l">context_list</text><path d="M80 151H1020M80 205H1020M80 259H1020M80 313H1020" stroke="#cbd5e1"/>
<text x="85" y="183" class="c f">offset=1, 後ろ</text><text x="275" y="183" class="c f">[ a, b, c, d, e ]</text><text x="650" y="183" class="c f">[ b, c, d, e, f ]</text><text x="85" y="237" class="c f">offset=1, 前</text><text x="275" y="237" class="c f">[ b, c, d, e, f ]</text><text x="650" y="237" class="c f">[ a, b, c, d, e ]</text><text x="85" y="291" class="c f">offset=2, 後ろ</text><text x="275" y="291" class="c f">[ a, b, c, d ]</text><text x="650" y="291" class="c f">[ c, d, e, f ]</text><text x="85" y="345" class="c f">offset=2, 前</text><text x="275" y="345" class="c f">[ c, d, e, f ]</text><text x="650" y="345" class="c f">[ a, b, c, d ]</text>
<path d="M550 392V421M542 413l8 8 8-8" fill="none" stroke="#64748b" stroke-width="2.5"/><text x="575" y="411" class="c s">torch.cat(...)</text><rect x="55" y="438" width="990" height="118" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="80" y="474" class="c l">X</text><text x="120" y="474" class="c f">= [ a b c d e | b c d e f | a b c d | c d e f ]</text><text x="80" y="510" class="c l">y</text><text x="120" y="510" class="c f">= [ b c d e f | a b c d e | c d e f | a b c d ]</text><text x="80" y="539" class="s">同じ位置の X[i] と y[i] が1つの訓練ペア（例：a → b、b → a、a → c、c → a）</text>
</svg>
