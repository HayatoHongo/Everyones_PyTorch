<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690"><rect width="1100" height="690" fill="white"/><style>text{font-family:Arial,'Noto Sans JP',sans-serif;fill:#172554}.c{font-family:Consolas,monospace}.s{font-size:16px}.l{font-size:18px;font-weight:bold}.f{font-size:17px}</style>
<text x="60" y="45" class="l">ids</text><text x="108" y="45" class="c l">= [ a, b, c, d, e, f ]</text><text x="60" y="76" class="s">window_size = 2：中心語から1語または2語離れた単語を正解にする</text><rect x="55" y="100" width="990" height="112" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="80" y="132" class="l">ids のスライスで、offset 個ずれた同じ長さの2列を作る</text><text x="90" y="166" class="c f">ids[:-offset]</text><text x="280" y="166" class="s">末尾を offset 個除く（中心語の列）</text><text x="610" y="166" class="c f">ids[offset:]</text><text x="780" y="166" class="s">先頭を offset 個除く（周辺語の列）</text><text x="90" y="193" class="c f">offset=2: [ a, b, c, d ]</text><text x="610" y="193" class="c f">offset=2: [ c, d, e, f ]</text>
<rect x="55" y="232" width="990" height="292" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="80" y="266" class="l">各 offset で center_list と context_list に追加する対応</text><path d="M80 286H1020M80 345H1020M80 404H1020M80 463H1020" stroke="#cbd5e1"/><text x="85" y="322" class="c f">1語後</text><text x="300" y="322" class="c f">[ a, b, c, d, e ]</text><text x="690" y="322" class="c f">[ b, c, d, e, f ]</text><text x="85" y="381" class="c f">1語前</text><text x="300" y="381" class="c f">[ b, c, d, e, f ]</text><text x="690" y="381" class="c f">[ a, b, c, d, e ]</text><text x="85" y="440" class="c f">2語後</text><text x="300" y="440" class="c f">[ a, b, c, d ]</text><text x="690" y="440" class="c f">[ c, d, e, f ]</text><text x="85" y="499" class="c f">2語前</text><text x="300" y="499" class="c f">[ c, d, e, f ]</text><text x="690" y="499" class="c f">[ a, b, c, d ]</text><text x="300" y="302" class="c l">center_list</text><text x="690" y="302" class="c l">context_list</text><path d="M550 542V567M542 559l8 8 8-8" fill="none" stroke="#64748b" stroke-width="2.5"/><text x="575" y="558" class="c s">torch.cat(...)</text><rect x="55" y="580" width="990" height="84" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="80" y="615" class="c l">X</text><text x="120" y="615" class="c f">= [ a b c d e | b c d e f | a b c d | c d e f ]</text><text x="80" y="646" class="c l">y</text><text x="120" y="646" class="c f">= [ b c d e f | a b c d e | c d e f | a b c d ]</text></svg>
