<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">A fully connected linear network from 49 pixels to 10 scores</title>
  <desc id="desc">Input pixel nodes on the left connect to every score node on the right through learned weights.</desc>
  <defs>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#f59e0b"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #172554; }
      .title { font-size: 28px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 700; }
      .small { font-size: 16px; fill: #475569; }
      .input { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .output { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .connection { stroke: url(#edge); stroke-width: 1.7; opacity: .52; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1100" height="560" fill="#ffffff"/>
  <text x="550" y="48" text-anchor="middle" class="title">Linear model: 49 → 10</text>
  <text x="260" y="98" text-anchor="middle" class="label">Input pixels</text>
  <text x="260" y="124" text-anchor="middle" class="small">X (49 values)</text>
  <text x="845" y="98" text-anchor="middle" class="label">Class scores</text>
  <text x="845" y="124" text-anchor="middle" class="small">Y (10 values)</text>

  <rect x="405" y="138" width="290" height="352" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="550" y="232" text-anchor="middle" class="label">W</text>
  <text x="550" y="260" text-anchor="middle" class="small">learned weights</text>
  <text x="550" y="292" text-anchor="middle" class="small">(49 × 10)</text>
  <text x="550" y="388" text-anchor="middle" class="label">Fully connected</text>
  <text x="550" y="416" text-anchor="middle" class="small">every input → every score</text>

  <g class="connection">
    <path d="M292 165 C455 165 650 165 808 165"/><path d="M292 165 C455 165 650 203 808 203"/><path d="M292 165 C455 165 650 241 808 241"/><path d="M292 165 C455 165 650 279 808 279"/><path d="M292 165 C455 165 650 317 808 317"/><path d="M292 165 C455 165 650 355 808 355"/><path d="M292 165 C455 165 650 393 808 393"/><path d="M292 165 C455 165 650 431 808 431"/><path d="M292 165 C455 165 650 469 808 469"/><path d="M292 165 C455 165 650 507 808 507"/>
    <path d="M292 223 C455 223 650 165 808 165"/><path d="M292 223 C455 223 650 203 808 203"/><path d="M292 223 C455 223 650 241 808 241"/><path d="M292 223 C455 223 650 279 808 279"/><path d="M292 223 C455 223 650 317 808 317"/><path d="M292 223 C455 223 650 355 808 355"/><path d="M292 223 C455 223 650 393 808 393"/><path d="M292 223 C455 223 650 431 808 431"/><path d="M292 223 C455 223 650 469 808 469"/><path d="M292 223 C455 223 650 507 808 507"/>
    <path d="M292 281 C455 281 650 165 808 165"/><path d="M292 281 C455 281 650 203 808 203"/><path d="M292 281 C455 281 650 241 808 241"/><path d="M292 281 C455 281 650 279 808 279"/><path d="M292 281 C455 281 650 317 808 317"/><path d="M292 281 C455 281 650 355 808 355"/><path d="M292 281 C455 281 650 393 808 393"/><path d="M292 281 C455 281 650 431 808 431"/><path d="M292 281 C455 281 650 469 808 469"/><path d="M292 281 C455 281 650 507 808 507"/>
    <path d="M292 339 C455 339 650 165 808 165"/><path d="M292 339 C455 339 650 203 808 203"/><path d="M292 339 C455 339 650 241 808 241"/><path d="M292 339 C455 339 650 279 808 279"/><path d="M292 339 C455 339 650 317 808 317"/><path d="M292 339 C455 339 650 355 808 355"/><path d="M292 339 C455 339 650 393 808 393"/><path d="M292 339 C455 339 650 431 808 431"/><path d="M292 339 C455 339 650 469 808 469"/><path d="M292 339 C455 339 650 507 808 507"/>
    <path d="M292 397 C455 397 650 165 808 165"/><path d="M292 397 C455 397 650 203 808 203"/><path d="M292 397 C455 397 650 241 808 241"/><path d="M292 397 C455 397 650 279 808 279"/><path d="M292 397 C455 397 650 317 808 317"/><path d="M292 397 C455 397 650 355 808 355"/><path d="M292 397 C455 397 650 393 808 393"/><path d="M292 397 C455 397 650 431 808 431"/><path d="M292 397 C455 397 650 469 808 469"/><path d="M292 397 C455 397 650 507 808 507"/>
    <path d="M292 455 C455 455 650 165 808 165"/><path d="M292 455 C455 455 650 203 808 203"/><path d="M292 455 C455 455 650 241 808 241"/><path d="M292 455 C455 455 650 279 808 279"/><path d="M292 455 C455 455 650 317 808 317"/><path d="M292 455 C455 455 650 355 808 355"/><path d="M292 455 C455 455 650 393 808 393"/><path d="M292 455 C455 455 650 431 808 431"/><path d="M292 455 C455 455 650 469 808 469"/><path d="M292 455 C455 455 650 507 808 507"/>
  </g>

  <g filter="url(#shadow)">
    <g class="input"><circle cx="270" cy="165" r="22"/><circle cx="270" cy="223" r="22"/><circle cx="270" cy="281" r="22"/><circle cx="270" cy="339" r="22"/><circle cx="270" cy="397" r="22"/><circle cx="270" cy="455" r="22"/></g>
    <g class="output"><circle cx="830" cy="165" r="22"/><circle cx="830" cy="203" r="22"/><circle cx="830" cy="241" r="22"/><circle cx="830" cy="279" r="22"/><circle cx="830" cy="317" r="22"/><circle cx="830" cy="355" r="22"/><circle cx="830" cy="393" r="22"/><circle cx="830" cy="431" r="22"/><circle cx="830" cy="469" r="22"/><circle cx="830" cy="507" r="22"/></g>
  </g>
  <text x="320" y="171" class="small">x₁</text><text x="320" y="229" class="small">x₂</text><text x="320" y="287" class="small">x₃</text><text x="320" y="345" class="small">⋮</text><text x="320" y="403" class="small">x₄₈</text><text x="320" y="461" class="small">x₄₉</text>
  <text x="868" y="171" class="small">Y₀</text><text x="868" y="209" class="small">Y₁</text><text x="868" y="247" class="small">Y₂</text><text x="868" y="285" class="small">Y₃</text><text x="868" y="323" class="small">Y₄</text><text x="868" y="361" class="small">Y₅</text><text x="868" y="399" class="small">Y₆</text><text x="868" y="437" class="small">Y₇</text><text x="868" y="475" class="small">Y₈</text><text x="868" y="513" class="small">Y₉</text>
  <text x="270" y="526" text-anchor="middle" class="small">⋮ 49 nodes</text>
</svg>
