<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
  <style>
    .title{font:700 28px sans-serif}.label{font:700 19px sans-serif}.formula{font:16px sans-serif;fill:#444}.axis{stroke:#444;stroke-width:2}.grid{stroke:#cbd5df;stroke-width:1}.curve{stroke:#2a78b7;stroke-width:5;fill:none;stroke-linejoin:round}.point{fill:#2a78b7}.tick{font:15px sans-serif;fill:#444;text-anchor:middle}.note{font:17px sans-serif;fill:#444;text-anchor:middle}
  </style>
  <text x="600" y="42" class="title" text-anchor="middle">幅2のReLU層を重ねたときの、各層の出力</text>
  <text x="600" y="74" class="note">横軸は同じ入力 x（0から1）。各グラフの縦軸は、その層から次の層へ渡す1個の値。</text>

  <!-- Common x coordinates: 130, 370, 610, 850, 1090 -->
  <g>
    <text x="50" y="150" class="label">第1層</text><text x="50" y="176" class="formula">h₁</text>
    <line x1="130" y1="215" x2="1090" y2="215" class="axis"/><line x1="130" y1="105" x2="130" y2="215" class="axis"/>
    <line x1="130" y1="160" x2="1090" y2="160" class="grid"/><line x1="370" y1="105" x2="370" y2="215" class="grid"/><line x1="610" y1="105" x2="610" y2="215" class="grid"/><line x1="850" y1="105" x2="850" y2="215" class="grid"/><line x1="1090" y1="105" x2="1090" y2="215" class="grid"/>
    <polyline points="130,215 610,105 1090,215" class="curve"/><circle cx="130" cy="215" r="5" class="point"/><circle cx="610" cy="105" r="5" class="point"/><circle cx="1090" cy="215" r="5" class="point"/>
    <text x="120" y="112" class="tick">1</text><text x="120" y="220" class="tick">0</text><text x="610" y="245" class="tick">0.5</text><text x="1090" y="245" class="tick">1</text>
    <text x="780" y="128" class="formula">h₁ = ReLU(2x) − 2 ReLU(2x − 1)</text>
  </g>

  <g>
    <text x="50" y="380" class="label">第2層</text><text x="50" y="406" class="formula">h₂</text>
    <line x1="130" y1="445" x2="1090" y2="445" class="axis"/><line x1="130" y1="335" x2="130" y2="445" class="axis"/>
    <line x1="130" y1="390" x2="1090" y2="390" class="grid"/><line x1="370" y1="335" x2="370" y2="445" class="grid"/><line x1="610" y1="335" x2="610" y2="445" class="grid"/><line x1="850" y1="335" x2="850" y2="445" class="grid"/><line x1="1090" y1="335" x2="1090" y2="445" class="grid"/>
    <polyline points="130,445 370,335 610,445 850,335 1090,445" class="curve"/><circle cx="130" cy="445" r="5" class="point"/><circle cx="370" cy="335" r="5" class="point"/><circle cx="610" cy="445" r="5" class="point"/><circle cx="850" cy="335" r="5" class="point"/><circle cx="1090" cy="445" r="5" class="point"/>
    <text x="120" y="342" class="tick">1</text><text x="120" y="450" class="tick">0</text><text x="370" y="475" class="tick">0.25</text><text x="610" y="475" class="tick">0.5</text><text x="850" y="475" class="tick">0.75</text><text x="1090" y="475" class="tick">1</text>
    <text x="775" y="358" class="formula">h₂ = ReLU(2h₁) − 2 ReLU(2h₁ − 1)</text>
  </g>

  <g>
    <text x="50" y="610" class="label">第3層</text><text x="50" y="636" class="formula">y</text>
    <line x1="130" y1="675" x2="1090" y2="675" class="axis"/><line x1="130" y1="565" x2="130" y2="675" class="axis"/>
    <line x1="130" y1="620" x2="1090" y2="620" class="grid"/><line x1="370" y1="565" x2="370" y2="675" class="grid"/><line x1="610" y1="565" x2="610" y2="675" class="grid"/><line x1="850" y1="565" x2="850" y2="675" class="grid"/><line x1="1090" y1="565" x2="1090" y2="675" class="grid"/>
    <polyline points="130,675 250,565 370,675 490,565 610,675 730,565 850,675 970,565 1090,675" class="curve"/>
    <g class="point"><circle cx="130" cy="675" r="5"/><circle cx="250" cy="565" r="5"/><circle cx="370" cy="675" r="5"/><circle cx="490" cy="565" r="5"/><circle cx="610" cy="675" r="5"/><circle cx="730" cy="565" r="5"/><circle cx="850" cy="675" r="5"/><circle cx="970" cy="565" r="5"/><circle cx="1090" cy="675" r="5"/></g>
    <text x="120" y="572" class="tick">1</text><text x="120" y="680" class="tick">0</text><text x="130" y="705" class="tick">0</text><text x="370" y="705" class="tick">0.25</text><text x="610" y="705" class="tick">0.5</text><text x="850" y="705" class="tick">0.75</text><text x="1090" y="705" class="tick">1</text>
    <text x="775" y="588" class="formula">y = ReLU(2h₂) − 2 ReLU(2h₂ − 1)</text>
  </g>
  <text x="600" y="790" class="note">山の数は 1個 → 2個 → 4個と増える。各層の出力を次の層に入力することで、より細かな形を作れる。</text>
</svg>
