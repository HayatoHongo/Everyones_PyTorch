<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <style>
    text { font-family: Arial, sans-serif; fill: #172554; }
    .title { font-size: 30px; font-weight: 700; }
    .label { font-size: 20px; font-weight: 700; }
    .small { font-size: 17px; }
    .box { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; }
    .code { fill: #f8fafc; stroke: #475569; stroke-width: 2; }
    .arrow { stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="650" fill="white"/>
  <text x="350" y="50" class="title">NeuralNetwork: 49 → 25 → 10</text>

  <text x="110" y="105" class="label">Input X</text>
  <rect x="75" y="135" width="175" height="150" rx="16" class="box"/>
  <text x="116" y="205" class="title">49</text>
  <text x="95" y="245" class="small">7 × 7 pixels</text>

  <line x1="255" y1="210" x2="390" y2="210" class="arrow"/>
  <text x="276" y="180" class="small">W1, b1</text>
  <text x="266" y="240" class="small">z = XW1 + b1</text>

  <rect x="405" y="135" width="175" height="150" rx="16" class="box"/>
  <text x="447" y="205" class="title">25</text>
  <text x="433" y="245" class="small">hidden values</text>

  <line x1="585" y1="210" x2="700" y2="210" class="arrow"/>
  <text x="607" y="180" class="small">ReLU</text>
  <text x="603" y="240" class="small">negative → 0</text>

  <rect x="715" y="135" width="175" height="150" rx="16" class="box"/>
  <text x="782" y="205" class="title">h</text>
  <text x="744" y="245" class="small">25 features</text>

  <line x1="895" y1="210" x2="1020" y2="210" class="arrow"/>
  <text x="914" y="180" class="small">W2, b2</text>
  <text x="904" y="240" class="small">Y = hW2 + b2</text>

  <rect x="1035" y="135" width="120" height="150" rx="16" class="box"/>
  <text x="1070" y="205" class="title">10</text>
  <text x="1051" y="245" class="small">scores</text>

  <text x="80" y="350" class="label">What __init__ stores</text>
  <rect x="75" y="375" width="465" height="205" rx="12" class="code"/>
  <text x="105" y="420" class="small">self.W1  : 49 × 25</text>
  <text x="105" y="455" class="small">self.b1  : 25</text>
  <text x="105" y="490" class="small">self.W2  : 25 × 10</text>
  <text x="105" y="525" class="small">self.b2  : 10</text>
  <text x="105" y="560" class="small">self.params = [W1, b1, W2, b2]</text>

  <text x="650" y="350" class="label">What forward(X) does</text>
  <rect x="645" y="375" width="475" height="205" rx="12" class="code"/>
  <text x="675" y="425" class="small">1. z = X @ self.W1 + self.b1</text>
  <text x="675" y="470" class="small">2. h = torch.relu(z)</text>
  <text x="675" y="515" class="small">3. Y_pred = h @ self.W2 + self.b2</text>
  <text x="675" y="560" class="small">4. return Y_pred</text>
</svg>
